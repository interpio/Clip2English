
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="stylesheet" href="/static/style.css">
  <title>Clip2English</title>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">MOBILE ENGLISH TRAINER</p>
        <h1>Clip2English</h1>
        <p class="sub">Turn a short YouTube clip into a compact English lesson.</p>
      </div>
      <button id="installBtn" class="secondary" hidden>Install</button>
    </header>

    <section class="card">
      <label for="url">YouTube link</label>
      <input id="url" inputmode="url" placeholder="https://youtu.be/..." autocomplete="off">

      <details>
        <summary>Subtitles not available? Paste transcript</summary>
        <textarea id="transcript" rows="7" placeholder="Paste English transcript here..."></textarea>
      </details>

      <button id="makeLesson">Create lesson</button>
      <p id="status" class="status"></p>
    </section>

    <section id="playerWrap" class="player-wrap" hidden>
      <iframe id="player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </section>

    <section id="lesson" class="lesson"></section>
  </main>

  <template id="itemTemplate">
    <article class="lesson-card">
      <div class="row">
        <span class="badge"></span>
        <button class="time secondary small"></button>
      </div>
      <p class="phrase"></p>
      <div class="notes"></div>
      <div class="actions">
        <button class="speak secondary">🔊 Listen</button>
        <button class="practice secondary">🎯 Practise</button>
      </div>
      <div class="practice-box" hidden>
        <p class="prompt">Say or type this sentence from memory:</p>
        <input class="answer" placeholder="Type it here...">
        <button class="check">Check</button>
        <p class="feedback"></p>
      </div>
    </article>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
